# External Capability Domain Registry
# Source of Truth for: external capability identity / provider / type / availability / auth model / permission model / capabilities / version / implementation
schema_version: 1

domain: external_capabilities
description: External capability identity, provider, type, availability, auth model, permission model, capabilities, version, implementation.

allowed_types:
  - plugin
  - mcp
  - connector
  - cli
  - external-api
  - integration

allowed_statuses:
  - available
  - limited
  - disabled
  - unknown

capabilities:
  wechat-draft-mcp:
    name: wechat-draft-mcp
    provider: wechat
    type: mcp
    status: limited
    provider_path: external-capabilities/providers/wechat/README.md
    version: 0.1.0
    implementation_path: external-capabilities/mcp/wechat-draft-mcp
    auth: "宿主注入环境变量 WECHAT_APP_ID / WECHAT_APP_SECRET，用于换取 access_token；调用方出口 IP 必须加入公众号 IP 白名单"
    capabilities: "把磁盘上的文章文件夹创建为微信草稿：上传前预检、创建草稿、按 media_id 读回核对。只创建草稿，不发布、不群发、不删除"
    permissions: "需要公众号的草稿箱与永久素材接口权限（draft/add、draft/get、draft/count、media/uploadimg、material/add_material），并需将出口 IP 加入白名单；未认证个人订阅号实测可用"
    notes: "自研、Store-managed。来源仓库为独立 git 仓库，已通过 git subtree 导入并保留完整提交历史；实现目录内含 README.md、HANDOFF.md 与 106 项自动化测试"

# External Capability Registry Schema (v1)
# capabilities is a mapping keyed by capability identifier (map key == name).
#
# SCOPE POLICY: this Store accepts STORE-MANAGED capabilities ONLY — i.e. code
# the Store itself hosts and maintains. Third-party capabilities whose code
# lives elsewhere (pure external connectors / APIs) are NOT registered here.
# If that policy ever changes, the schema must be extended with an explicit
# hosting declaration rather than by inferring intent from a missing field.
#
# Required fields per entry:
#   name           == map key, lowercase kebab-case
#   provider       provider identifier (lowercase kebab-case)
#   type           one of allowed_types
#   status         one of allowed_statuses
#   provider_path  external-capabilities/providers/<provider>/README.md (must exist)
#   version          semantic X.Y.Z — the Store-recommended version (see VERSIONING.md)
#   implementation_path  relative repo path to the Store-managed implementation,
#                        e.g. external-capabilities/mcp/<capability-name>/
#                        REQUIRED: the path must exist, must be relative with no
#                        ../, and must live under external-capabilities/.
#
# Why implementation_path and version are required rather than optional: while
# they were optional, an entry that simply omitted implementation_path skipped
# every implementation check and still reported a clean run, pointing at no code
# at all — a silent failure. Requiring them removes the ambiguity; a missing
# field is now an error instead of a different-but-valid shape.
#
# Optional (when known):
#   auth           authentication model — metadata only, NEVER secret values
#   capabilities   what the capability can do
#   permissions    required / verified permissions only
#   notes          free-form notes
#
# No fictional providers or capabilities are registered in this skeleton.
#
# Documentation example (NOT registered — for contract illustration only):
#   capabilities:
#     feishu-cli-mcp-server:
#       name: feishu-cli-mcp-server
#       provider: feishu
#       type: mcp
#       status: available
#       version: 0.1.0
#       implementation_path: external-capabilities/mcp/feishu-cli-mcp-server
#       provider_path: external-capabilities/providers/feishu/README.md
