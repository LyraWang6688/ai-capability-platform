# Skill Domain Registry
# Source of Truth for: Skill identity / path / lifecycle / version
schema_version: 1

domain: skills
description: Skill identity, path, lifecycle status, and version.

projects: {}

shared: {}

allowed_statuses:
  - draft
  - testing
  - active
  - deprecated
  - archived

# Skill Registry Schema (v1)
# projects and shared are mappings keyed by Skill identifier (map key == name).
# Required fields per entry:
#   name      == map key, lowercase kebab-case
#   path      relative repo path, a directory under the correct domain
#             (skills/shared/<name>/ or skills/projects/<project>/<name>/)
#             containing SKILL.md and agents/openai.yaml
#   status    one of allowed_statuses
#   version   semantic X.Y.Z (see VERSIONING.md)
#   updated   YYYY-MM-DD
# projects entries additionally require:
#   project   owning project identifier (lowercase kebab-case)
#
# Example (shared):
#   shared:
#     repo-hygiene:
#       name: repo-hygiene
#       path: skills/shared/repo-hygiene
#       status: testing
#       version: 0.1.0
#       updated: "2026-10-01"
# Example (project-specific):
#   projects:
#     meeting-analysis:
#       name: meeting-analysis
#       project: meeting-agent
#       path: skills/projects/meeting-agent/meeting-analysis
#       status: testing
#       version: 0.1.0
#       updated: "2026-10-01"
# Note: quote the date (or rely on YAML date parsing) — both are accepted.
